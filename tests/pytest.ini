# Used by tests/harness/run_suite.py (-c tests/pytest.ini --rootdir <repo>).  Run tests through the runner,
# not bare pytest, so every run writes its results file (context/testing.md TS-H11).
[pytest]
python_files = test_*.py
python_functions = test_*
python_classes = Test*
xfail_strict = true
markers =
    slow: takes more than about 10 seconds; still part of every full run
filterwarnings =
    ignore::DeprecationWarning
